[project]
name = "orakel"
version = "0.1.0"
description = "WoW Mythic+ dungeon performance predictor — Medallion pipeline with Raider.IO + WarcraftLogs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minio>=7.2.20",
    "pyspark>=4.1.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[tool.setuptools.packages.find]
include = ["orakel*"]
exclude = ["jars*", "data*", "scripts*"]
