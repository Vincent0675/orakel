[project]
name = "orakel"
version = "0.1.0"
description = "WoW Mythic+ dungeon performance predictor — Medallion pipeline with Raider.IO + WarcraftLogs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minio>=7.2.20",
    "pyspark>=4.1.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "plotly>=6.8.0",
    "streamlit>=1.58.0",
]
test = ["pytest>=8", "pytest-cov>=6", "responses>=0.25", "chispa>=0.12"]

[tool.pytest.ini_options]
markers = ["spark: tests requiring an active SparkSession"]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["orakel"]
branch = true

[tool.setuptools.packages.find]
include = ["orakel*"]
exclude = ["jars*", "data*", "scripts*"]
